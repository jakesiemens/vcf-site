<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Connecting to VCF Sermon Publisher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e3142;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 40px 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #EA642A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px 0; font-size: 1.35rem; font-weight: 700; }
        p { color: #94aec5; font-size: 0.95rem; margin: 0 0 24px 0; line-height: 1.4; }
        .btn {
            display: inline-block;
            background: #EA642A;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #ce5119; }
        .hint { margin-top: 18px; font-size: 0.82rem; color: #7890a8; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>Connecting to Sermon Publisher...</h2>
        <p>Connecting securely to Victory Christian Fellowship's publishing portal.</p>
        <a id="portal-link" href="https://finance-griffin-withdrawal-pay.trycloudflare.com" class="btn">Open Portal Directly</a>
        <div class="hint" id="status-hint">Resolving active portal link...</div>
    </div>

    <script>
        var fallbackUrl = "https://finance-griffin-withdrawal-pay.trycloudflare.com";
        var targetUrl = fallbackUrl;

        function redirect(url) {
            if (url) {
                var btn = document.getElementById('portal-link');
                if (btn) btn.href = url;
                window.location.replace(url);
            }
        }

        var ts = Date.now();
        var urlsToTry = [
            'tunnel.json?v=' + ts,
            'https://raw.githubusercontent.com/jakesiemens/vcf-site/main/upload/tunnel.json?v=' + ts
        ];

        function tryNext(index) {
            if (index >= urlsToTry.length) {
                setTimeout(function() { redirect(fallbackUrl); }, 500);
                return;
            }
            fetch(urlsToTry[index], { cache: 'no-store' })
                .then(function(res) {
                    if (res.ok) return res.json();
                    throw new Error('Not ok');
                })
                .then(function(data) {
                    if (data && data.url) {
                        targetUrl = data.url;
                        var hint = document.getElementById('status-hint');
                        if (hint) hint.textContent = 'Redirecting...';
                        redirect(targetUrl);
                    } else {
                        tryNext(index + 1);
                    }
                })
                .catch(function() {
                    tryNext(index + 1);
                });
        }

        tryNext(0);

        setTimeout(function() {
            redirect(targetUrl);
        }, 3000);
    </script>
</body>
</html>
